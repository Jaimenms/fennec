[tool.poetry]
name = "fennec"
version = "0.1.0a.dev0"
description = "Fennec is a energy management optmizer for a smart home"
license = "Proprietary"
authors = [
    "Jaime Souza <jaimenms@gmail.com>",
]
maintainers = [
    "Jaime Souza <jaimenms@gmail.com>",
]
readme = "README.md"
repository = "https://github.com/Jaimenms/fennec"
keywords = ["optimization", "energy", "management", "smart", "home"]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [
    { include = "fennec", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
highspy = "^1.10"
pyomo = "^6.9.1"
pysolar = "^0.13"

[tool.poetry.dev-dependencies]
checksumdir = "^1.2"
pytest = "*"
black = "^24.4"
coverage = "^7.4"
coverage-badge = "^1.1"
jupyter = "^1.0.0"
ipykernel = "^6.0.0"
pandas = "^2.1"
matplotlib = "^3.10"

[[tool.poetry.source]]
name = "custom_pypi"
url = "https://pypi.org/simple"

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.report]
skip_empty = true

[tool.pytest.ini_options]
pythonpath = "."
testpaths = [
    "tests/unit",
]
