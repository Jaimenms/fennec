[tool.poetry]
name = "fennec"
version = "0.2.0"
description = "Cost optimizer for the flexible assets of a smart home: batteries, EVs and more, with brand-specific controllers"
license = "Proprietary"
authors = [
    "Jaime Souza <jaimenms@gmail.com>",
]
maintainers = [
    "Jaime Souza <jaimenms@gmail.com>",
]
readme = "README.md"
repository = "https://github.com/Jaimenms/fennec"
keywords = ["optimization", "energy", "management", "smart", "home"]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [
    { include = "fennec", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
highspy = "^1.10"
pyomo = "^6.9.1"
pysolar = "^0.13"
pandas = { version = "^2.1", optional = true }
matplotlib = { version = "^3.10", optional = true }

[tool.poetry.extras]
viz = ["pandas", "matplotlib"]

[tool.poetry.group.dev.dependencies]
pytest = "*"
black = "^24.4"
coverage = "^7.4"
jupyter = "^1.0.0"
ipykernel = "^6.0.0"
nbconvert = "^7.16"
pandas = "^2.1"
matplotlib = "^3.10"

[tool.poetry.scripts]
fennec = "fennec.cli:main"

[[tool.poetry.source]]
name = "custom_pypi"
url = "https://pypi.org/simple"

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.report]
skip_empty = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = [
    "tests/unit",
]
filterwarnings = [
    "ignore:no explicit representation of timezones available:UserWarning",
    "ignore:Leap seconds for year:UserWarning",
]
